openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: early-access
    description: Early access signups for the pre-launch beauty brand
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /early-access:
    post:
      operationId: createEarlyAccessSignup
      tags: [early-access]
      summary: Join the early access list
      description: Stores a pre-launch signup. Submissions are idempotent by email address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EarlyAccessSignupInput"
      responses:
        "202":
          description: Signup accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EarlyAccessSignupResult"
        "400":
          description: Invalid signup details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    EarlyAccessSignupInput:
      type: object
      additionalProperties: false
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 320
        whatsappNumber:
          type: string
          minLength: 7
          maxLength: 24
      required:
        - firstName
        - email
    EarlyAccessSignupResult:
      type: object
      properties:
        message:
          type: string
      required:
        - message
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

